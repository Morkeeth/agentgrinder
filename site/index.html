<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Grinder — where you post your real runs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f3f2ec; --card:#fbfaf6; --line:#e0ded3; --ink:#1c1913; --muted:#726c5e;
    --accent:#1c6a46; --accent-ink:#134e33; --accent-soft:#e4ede6;
    --disp:"Archivo",-apple-system,BlinkMacSystemFont,sans-serif; --mono:"Space Mono",ui-monospace,Menlo,monospace; }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15.5px/1.5 var(--disp);
    -webkit-font-smoothing:antialiased}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  header{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(247,248,248,.9);backdrop-filter:blur(8px);z-index:5}
  .logo{display:flex;align-items:center;gap:9px;cursor:pointer;color:var(--ink);text-decoration:none}
  .logo .mk{width:30px;height:30px}
  .logo .wm{font-weight:800;font-size:16px;letter-spacing:.14em;text-transform:uppercase}
  .spacer{flex:1}
  button{font:inherit;font-weight:600;font-size:14px;background:var(--accent);color:#fff;border:1px solid var(--accent);
    border-radius:6px;padding:9px 16px;cursor:pointer;transition:background .12s,border-color .12s;line-height:1;letter-spacing:.02em}
  button:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
  button:active{transform:translateY(.5px)}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}

  .av{width:40px;height:40px;border-radius:10px;overflow:hidden;flex-shrink:0}
  .phero .av{border-radius:14px}
  .who a{font-weight:600;color:var(--ink);text-decoration:none} .who a:hover{color:var(--accent-ink)}
  .who small{color:var(--muted);display:block;font-size:13px}
  .title{padding:2px 17px 2px;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .sub{padding:0 17px 14px;color:var(--muted);font-size:13.5px}
  .hl{display:flex;align-items:baseline;gap:12px;padding:4px 17px 8px;cursor:help}
  .hl .n{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--accent-ink)}
  .hl .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
  .hl .k .f{display:block;font-size:11.5px;text-transform:none;letter-spacing:0;font-family:var(--mono)}
  .fiverow{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .five{background:var(--card);padding:9px 6px 8px;text-align:center;cursor:help}
  .five .v{font-size:14px;font-weight:700;white-space:nowrap}
  .five .k{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;line-height:1.25}
  .five[data-missing] .v{color:var(--muted);font-weight:400} .five.cost .v{color:var(--muted)}
  .costtag{font-style:normal;display:inline-block;margin-left:4px;padding:0 4px;border-radius:4px;background:var(--line);color:var(--muted);font-size:9px}
  .grp{padding:10px 17px 0;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
  @media (max-width:420px){.fiverow{grid-template-columns:repeat(2,1fr)}.five:nth-child(5){grid-column:span 2}.hl .n{font-size:32px}}
  .stats{display:flex;padding:2px 17px 14px;gap:28px}
  .stat .v{font-size:22px;font-weight:700;font-family:var(--mono);letter-spacing:-.03em}
  .stat .v i{font-style:normal;font-size:14px;font-weight:600;color:var(--muted)}
  .stat .k{font-size:12px;color:var(--muted)}
  .curve{display:block;width:100%;height:104px;background:linear-gradient(180deg,#fff,#fbfdfc)}
  .foot{display:flex;align-items:center;gap:12px;padding:11px 17px;border-top:1px solid var(--line);
    color:var(--muted);font-size:13.5px}
  .kudo{display:flex;align-items:center;gap:7px;cursor:pointer;background:none;border:1px solid var(--line);
    color:var(--ink);padding:6px 13px;border-radius:999px;font-weight:600;font-size:13.5px}
  .kudo.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
  .kudo .n{color:var(--muted);font-weight:500}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:20px}
  .panel h3{margin:0 0 12px;font-size:17px;font-weight:600}
  .flex-panel{padding:8px 18px 14px}

  label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
  input,textarea,select{width:100%;font:inherit;background:#fff;color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin-bottom:12px}

  .row{display:flex;gap:11px} .row>*{flex:1}

  .empty{color:var(--muted);text-align:center;padding:48px 16px;line-height:1.7}

  .ob-step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}

  .ob-step.done{opacity:.85;border-color:var(--accent-soft)}
  .ob-step.done h3::after{content:' ✓';color:var(--accent);font-weight:700}
  .cmd{background:#eef0f1;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:13px;margin:10px 0;word-break:break-all}
  .ob-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .ack-picker{padding:12px 17px 14px;border-top:1px solid var(--line);background:var(--bg)}

    border:1px solid var(--line);background:#fff;cursor:pointer}

  .ack-chip small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:2px}
  .ack-list{padding:0 17px 14px}
  .ack-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}

  .ack-row span{color:var(--muted);font-size:13px}

  @media (prefers-reduced-motion: no-preference){
    .rdot{opacity:0;animation:rdotin .3s ease-out forwards}
    @keyframes rdotin{to{opacity:1}}
    .rline{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 1s ease-out .1s forwards}
    .cbar{transform:scaleX(0);transform-origin:left;animation:grow .6s cubic-bezier(.2,.7,.2,1) .05s forwards}
    @keyframes grow{to{transform:scaleX(1)}}
  }

  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
  @keyframes tick{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.panel,.phero,.ptotals{animation:rise .34s cubic-bezier(.2,.7,.2,1) both}
    .card:nth-child(2){animation-delay:.03s} .card:nth-child(3){animation-delay:.06s}
    .card:nth-child(4){animation-delay:.09s} .card:nth-child(5){animation-delay:.12s}
    .card:nth-child(6){animation-delay:.15s} .card:nth-child(n+7){animation-delay:.18s}
    #status:not(:empty){animation:tick .2s ease-out}
    .kudo.pop{animation:pop .22s ease-out}
  }

  /* signature device: the grind curve draws itself in; the runner is the empty/loading soul */
  .curve polyline{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw .9s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .runner{font-family:ui-monospace,Menlo,monospace;white-space:pre;line-height:1.05;color:var(--accent);
    font-size:15px;display:inline-block;text-align:left;margin-bottom:14px}
  .runline{color:var(--line);font-family:ui-monospace,monospace;letter-spacing:-1px}
  /* share card — 1200×630 ticket, scaled to fit */
  .share-scene{background:#1a1916;margin:-22px -16px 0;padding:28px 16px 40px;min-height:calc(100vh - 120px)}
  .share-scale{width:100%;max-width:1200px;margin:0 auto;overflow:hidden;border-radius:14px}
  .share-frame{width:1200px;height:630px;transform-origin:top left;background:var(--bg);
    display:flex;flex-direction:column;font-family:var(--disp);color:var(--ink);
    box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .share-main{flex:1;display:grid;grid-template-columns:1fr 1.05fr;min-height:0}
  .share-left{padding:44px 40px 28px;display:flex;flex-direction:column;justify-content:space-between;
    border-right:1px solid var(--line);background:linear-gradient(165deg,#f7f5ef,#f0ede4)}
  .share-brand{font-weight:800;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .share-handle-row{display:flex;align-items:flex-start;gap:20px;margin-top:28px}
  .share-av{width:72px;height:72px;border-radius:16px;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:32px;flex-shrink:0}
  .share-handle{font-family:var(--mono);font-size:58px;font-weight:700;letter-spacing:-.04em;line-height:1}
  .share-stamp{margin-top:14px;transform:rotate(-11deg);display:inline-block;border:3px solid var(--accent);
    color:var(--accent);font-weight:800;font-size:15px;letter-spacing:.22em;padding:7px 18px;border-radius:5px;
    background:rgba(28,106,70,.06)}
  .share-lead{margin-top:22px;font-size:20px;font-weight:700;letter-spacing:-.02em}
  .share-sub{margin-top:6px;font-size:15px;color:var(--muted);line-height:1.45;max-width:420px}
  .share-right{padding:36px 40px 28px;display:flex;flex-direction:column;justify-content:center;background:var(--card)}
  .share-hero{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
  .share-hero .n{font-family:var(--mono);font-size:88px;font-weight:700;letter-spacing:-.05em;color:var(--accent);line-height:1}
  .share-hero .k{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
  .share-hl{font-size:17px;font-weight:600;line-height:1.45;margin:12px 0 18px;padding-left:14px;border-left:3px solid var(--accent)}
  .share-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:auto}
  .share-stats .stat{background:var(--card);padding:14px 16px}
  .share-stats .v{font-family:var(--mono);font-size:22px;font-weight:700}
  .share-stats .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:4px}
  .share-curve{margin:10px 0 16px;display:flex;justify-content:flex-end}
  .share-curve svg{display:block}
  .share-stub{height:118px;background:repeating-linear-gradient(135deg,#e8e5db,#e8e5db 10px,#e2dfd4 10px,#e2dfd4 11px);
    border-top:2px dashed #c8c4b8;display:flex;align-items:center;justify-content:space-between;padding:0 44px;position:relative}
  .share-stub::before,.share-stub::after{content:'';position:absolute;top:-9px;width:18px;height:18px;background:#1a1916;border-radius:50%}
  .share-stub::before{left:28px}.share-stub::after{right:28px}
  .share-stub .cta{font-size:26px;font-weight:900;letter-spacing:-.03em;text-transform:uppercase}
  .share-stub .cta span{color:var(--accent)}
  .share-stub .url{font-family:var(--mono);font-size:15px;color:var(--muted);font-weight:700}
  .share-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .vibe-chip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent-ink);background:var(--accent-soft);padding:3px 9px;border-radius:6px;margin-left:8px;vertical-align:middle}
  .bingo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
  .bingo-cell{border:1px dashed var(--line);border-radius:10px;padding:12px 8px;text-align:center;font-size:12px;
    font-weight:700;color:var(--muted);background:var(--card)}
  .bingo-cell.on{border-style:solid;border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
  .share-roast{margin:12px 0;padding:12px 14px;border-left:3px solid #a14b5e;background:rgba(161,75,94,.06);font-size:13.5px;color:var(--muted);line-height:1.5}
  .share-roast ul{margin:8px 0 0 18px}
  .ghost-tag{font-size:11px;font-weight:800;letter-spacing:.08em;color:#7a5c9e;background:#efe8f4;padding:3px 8px;border-radius:6px;margin-left:6px}
  .rig-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .rig-chip{font-family:var(--mono);font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink)}
</style></head>

const esc=s=>(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function roastShapeLines(r){
  const p=r.prompts||0,t=r.tool_calls||0,c=r.commits||0,regs=r.route?new Set(r.route).size:0;

const fmtDur=m=>!m?'-':(m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`);
// VERIFIED PER TURN — the headline. (verified claims + artifacts produced) ÷ prompts typed.
// Prompts are the COST (the denominator), never the headline. A part the row does not carry
// prints an em-dash whose tooltip names who owns it; a missing part is never defaulted to 0.
const VPT_TIP='verified per turn = (verified claims + artifacts produced) ÷ typed turns · local v0 rule over-counts, read it as a ceiling until Helicon witness replaces it';
const VPT_SRC={
  claims_verified:'Helicon witness (claim-witness log); local v0 = agentgrinder claims.py — not stored by the web app yet',
  artifacts_produced:'Edit/Write paths that exist at close (agentgrinder v0); promised = ZUP artifact-detect — not stored by the web app yet',
  corrections:'Transcripto export-run (coach classifier) — not built yet',
  reach:'git remotes + gh + the launch log — did the output cross to a person who is not the author'};
function vpt(r){
  const v=r.claims_verified, a=r.artifacts_produced, p=r.prompts;
  if(v==null||a==null||!p) return null;
  return (v+a)/p;
}
function vptFormula(r){
  const x=vpt(r); if(x!=null) return `(${r.claims_verified} verified + ${r.artifacts_produced} artifacts) ÷ ${r.prompts} typed turns`;
  const miss=[]; if(r.claims_verified==null) miss.push('verified claims'); if(r.artifacts_produced==null) miss.push('artifacts produced'); if(!r.prompts) miss.push('typed turns');
  return 'needs '+miss.join(', ');
}
function vptText(r){ const x=vpt(r); return x==null?'—':x.toFixed(2); }
function vptHtml(r){
  return `<div class="hl" title="${esc(VPT_TIP+' · '+vptFormula(r))}"><div class="n num">${vptText(r)}</div><div class="k">verified per turn<span class="f">${esc(vptFormula(r))}</span></div></div>`;
}
function fiveRow(r){

  const corr=(r.corrections!=null&&r.prompts)?`${Math.round(100*r.corrections/r.prompts)}%`:'—';
  const prod=`${r.artifacts_produced??'—'} ÷ ${r.artifacts_promised??'—'}`;
  const reach=r.reach==null?'—':(r.reach?'yes':'no');

}
const pace=(m,p)=>(!m||!p)?'-':`${Math.floor(Math.round(m*60/p)/60)}:${String(Math.round(m*60/p)%60).padStart(2,'0')}`;

const ACK_REASONS={
  shipped:{label:'Shipped',evidence:'commits on this grind'},
  focus:{label:'Deep focus',evidence:'sustained prompt cadence'},
  pace:{label:'Strong pace',evidence:'high prompts per hour'},
  rig:{label:'Rig worth copying',evidence:'harness + tools setup'},
  comeback:{label:'Comeback',evidence:'recovery after a stall'},
  handoff:{label:'Trust the handoff',evidence:'long agent-active stretch'},
};
function vibeForRun(r){
  const p=r.prompts||0, t=r.tool_calls||0, c=r.commits||0, regs=r.route?new Set(r.route).size:0;
  if(p<=3&&t>=40) return ['MAIN CHARACTER','One prompt. The agent did the rest.'];
  if(p>=1&&t/p>=22) return ['FERAL','High tool-to-prompt ratio. Harness parkour.'];
  if(p>=20&&t/p<6) return ['TOUCH GRASS','You typed a lot. The agent barely moved.'];
  if(c>=2&&p<=12) return ['SURGICAL','Few prompts, multiple commits.'];
  if(regs>=6) return ['REGION HOPPER','Bounced across the codebase.'];
  if(p>=45) return ['PROMPT MARATHON','Your keyboard carried the team.'];
  if(t>=30&&c===0) return ['ZERO SHIP','Lots of motion, no commit.'];
  if(c>=1&&p>=5) return ['ACTUALLY SHIPPED','Commits on the board.'];
  if(p) return ['ORDINARY GRIND',`${p} real prompts. Still postable.`];
  return null;
}
function ackBingoHtml(acks){

}
function suggestAckReasons(r){

  const dur=r.duration_s||0, pr=r.prompts||0;
  if(dur&&pr&&pr/(dur/3600)>=18) out.push('pace');
  if(!out.length) out.push('focus','pace');
  return [...new Set(out)].slice(0,3);
}

function grindShape(runs, acksReceived){
  // Only real, verifiable signals. No composite score, no arbitrary thresholds.
  const ships=runs.filter(r=>r.is_ship).length;
  const projects=new Set(runs.map(r=>r.project).filter(Boolean)).size;
  const withCommits=runs.filter(r=>(r.commits||0)>0).length;
  const verifyRate=runs.length?Math.round(withCommits/runs.length*100):0; // % of runs that shipped a commit
  const labels=[];
  if(ships>0) labels.push(ships+(ships===1?' ship':' ships'));       // real: checked releases
  if(acksReceived>0) labels.push(acksReceived+' ACKs');              // real: earned recognition
  if(projects>1) labels.push(projects+' projects');                  // real: range
  return {ships, projects, verifyRate, labels};
}

function curve(r){ r=(r&&r.length)?r:[1]; const w=600,h=104,p=8,n=r.length,mx=Math.max(...r)||1;
  const x=i=>p+i*(w-2*p)/Math.max(n-1,1),y=v=>h-p-(v/mx)*(h-2*p);
  const pts=r.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="curve" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polygon points="${p},${h-p} ${pts} ${w-p},${h-p}" fill="var(--accent)" fill-opacity="0.09"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/></svg>`; }

function routeMap(route){ if(!route||!route.length) return '';
  const w=600,h=118,pad=14,n=route.length,R=Math.max(...route)+1;
  const bandH=(h-2*pad)/Math.max(R,1);
  const x=i=>pad+i*(w-2*pad)/Math.max(n-1,1);
  const y=r=>pad+bandH*(r+0.5);
  const cols=['#12805a','#2f6f8f','#8a6d3b','#7a4b8a','#a14b5e','#3b7a4b'];
  let bands=''; for(let r=0;r<R;r++){ bands+=`<line x1="${pad}" x2="${w-pad}" y1="${y(r)}" y2="${y(r)}" stroke="var(--line)" stroke-width="1"/>`; }
  const pts=route.map((r,i)=>`${x(i).toFixed(1)},${y(r).toFixed(1)}`).join(' ');
  let dots=route.map((r,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(r).toFixed(1)}" r="3" fill="${cols[r%cols.length]}" class="rdot" style="animation-delay:${(i*0.04).toFixed(2)}s"/>`).join('');
  return `<div style="padding:2px 0 0"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;width:100%;height:118px;background:linear-gradient(180deg,#fff,#fafcfb)">${bands}<polyline class="rline" points="${pts}" fill="none" stroke="var(--ink)" stroke-opacity="0.5" stroke-width="2" stroke-linejoin="round"/>${dots}</svg><div style="display:flex;gap:12px;padding:6px 17px 0;flex-wrap:wrap;font-size:11.5px;color:var(--muted)">${route.reduce((a,r)=>a.includes(r)?a:a.concat(r),[]).sort((a,b)=>a-b).map(r=>`<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${cols[r%cols.length]};margin-right:4px"></span>region ${r+1}</span>`).join('')}</div></div>`; }

function harnessLabel(h){
  const s=(h||'').toLowerCase();
  if(s.includes('claude')) return 'Claude';
  if(s.includes('cursor')) return 'Cursor';
  if(s.includes('codex')) return 'Codex';
  if(s.includes('fleet')||s.includes('night')) return 'Fleet';
  return h||'agent';
}
function compareAgents(runs){
  if(!runs||runs.length<2) return '';
  const by={};
  runs.forEach(r=>{
    const h=harnessLabel(r.harness);
    if(!by[h]) by[h]={runs:0,prompts:0,minutes:0,commits:0};
    by[h].runs++; by[h].prompts+=r.prompts||0;
    by[h].minutes+=Math.round((r.duration_s||0)/60);
    by[h].commits+=r.commits||0;
  });
  const keys=Object.keys(by);
  if(keys.length<2) return '';
  const rows=keys.sort((a,b)=>by[b].runs-by[a].runs).map(h=>{
    const b=by[h];
    return `<div class="flex-row"><b>${esc(h)}</b><span class="hint">${b.runs} runs · ${b.prompts} prompts · ${b.minutes}m · ${b.commits} commits</span></div>`;
  }).join('');
  return `<h2 class="sec">Flex · across agents</h2><div class="panel flex-panel">${rows}</div>`;
}
function coachLine(runs){
  if(!runs||!runs.length) return '';
  const by={};
  runs.forEach(r=>{
    const h=harnessLabel(r.harness);
    if(!by[h]) by[h]={runs:0,prompts:0,minutes:0};
    by[h].runs++; by[h].prompts+=r.prompts||0; by[h].minutes+=Math.round((r.duration_s||0)/60);
  });
  const keys=Object.keys(by);
  if(keys.length<2){
    return `<p class="hint" style="margin:0 0 12px">Post from Claude and Cursor to flex across agents — <span class="num">agentgrinder flex</span> on your machine.</p>`;
  }
  const top=keys.sort((a,b)=>(by[b].prompts/by[b].runs)-(by[a].prompts/by[a].runs))[0];
  const avg=Math.round(by[top].prompts/by[top].runs);
  return `<p class="hint" style="margin:0 0 12px">Your deepest sits: <b>${esc(top)}</b> (${avg} prompts/run avg). Flex the rest — <span class="num">agentgrinder grind --harness auto --push</span>.</p>`;
}

function vptTotals(R){
  const full=R.filter(r=>r.claims_verified!=null&&r.artifacts_produced!=null&&r.prompts);
  const num=full.reduce((a,r)=>a+r.claims_verified+r.artifacts_produced,0), den=full.reduce((a,r)=>a+r.prompts,0);
  const x=den?num/den:null;
  return {vpt:x==null?'—':x.toFixed(2), vptVal:x,
    vptFormula:x==null?`needs verified claims + artifacts produced on at least one run (${R.length} runs, none stored with them yet)`:`(${num} verified + artifacts) ÷ ${den} typed turns over ${full.length} of ${R.length} runs`};
}

function countUp(){ document.querySelectorAll('[data-count]').forEach(el=>{
  const target=parseFloat(el.getAttribute('data-count')); if(isNaN(target)) return;
  const dur=520, t0=performance.now(), dec=(target%1!==0);
  function step(t){ const p=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-p,3);
    el.textContent=dec?(target*e).toFixed(1):Math.round(target*e); if(p<1) requestAnimationFrame(step); }
  requestAnimationFrame(step); }); }

// The five tools and the three modes, in words, with no account. Named exactly as the code names
// them, so a reader can grep agentgrinder/coach/tools.py and agentgrinder/coach/agent.py.
function howItWorks(){
  const tools=[
    ['read_run','cuts the sitting out of the transcript, counts the typed turns, and lists every claim line and every file the run wrote.'],
    ['check_claim','looks for evidence in the same typed turn as the claim and returns the matching tool result, or says there was none.'],
    ['verify_artifact','asks the disk whether the file exists, how big it is, and whether it was written inside the sitting.'],
    ['git_evidence','asks git which commits inside the sitting carry the file, and the first commit after it that did.'],
    ['write_verdict','writes the paragraph and the next-session plan, and refuses any number no tool in that run returned.']];
  const modes=[
    ['local','the default. A real Strands agent loop over the five tools, driven by a scripted local model. Keyless, no network, no spend.'],
    ['bedrock','opt in. The same loop with a real model on Amazon Bedrock. Needs AWS credentials, costs money, and sends the claim lines off your machine. The command says so before it runs.'],
    ['none','no agent. The five tools called in a fixed order.']];
  const row=(k,v,i)=>`<div class="flex-row" style="display:block;padding:11px 0${i?'':';border-top:none'}">
    <b class="num" style="font-size:13.5px">${esc(k)}</b>
    <div class="hint" style="margin-top:3px;line-height:1.55">${esc(v)}</div></div>`;
  return `<h2 class="sec">How it works</h2>
  <div class="panel flex-panel"><h3 style="margin:14px 0 2px;font-size:15px">The five tools the coach calls</h3>
    ${tools.map((t,i)=>row(t[0],t[1],i)).join('')}</div>
  <div class="panel flex-panel"><h3 style="margin:14px 0 2px;font-size:15px">Three modes, and the mode is always printed</h3>
    ${modes.map((m,i)=>row(m[0],m[1],i)).join('')}
    <div class="hint" style="border-top:1px solid var(--line);padding:11px 0 4px;line-height:1.55">
      A mode that fails does not fall back quietly. The run is marked <b>DEGRADED</b>, and the screen names the failure, the reason, and the mode it fell back to.</div></div>
  <div class="panel"><h3 style="font-size:15px">What leaves your machine</h3>
    <p class="hint" style="margin:0;line-height:1.6">Only if you publish, and only what you can see first: counts, pace, commits, the grind curve, and the coach paragraph. Never a prompt you typed. Never code. Never a file path from outside the repo. <a href="/privacy">Privacy</a> · <a href="/methodology">Methodology</a></p></div>`;
}

  if(ME) head=`<div class="panel"><h3>Log a run</h3>
    <p class="hint" style="margin:0 0 12px">Runs are logged from your machine, nothing here reads your transcripts. One command after a session:</p>
    <div style="background:#f2f4f2;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-family:ui-monospace,Menlo,monospace;font-size:13.5px">agentgrinder run --push</div>
    <p class="hint" style="margin:0">or add the MCP so your agent logs its own run for approval. Metrics only, never your prompts or code. <a href="#" id="manuallink">Log one manually instead</a></p>
    <div id="manualbox" hidden style="margin-top:12px">
      <input id="f_title" placeholder="Title, e.g. agent-attack, Sunday night">
      <input id="f_project" placeholder="project">
      <input id="f_note" placeholder="what did this session do? (optional, you write it)">
      <div class="row"><div><label>prompts</label><input id="f_prompts" type="number"></div><div><label>minutes</label><input id="f_dur" type="number"></div><div><label>commits</label><input id="f_commits" type="number"></div></div>
      <div class="row"><select id="f_vis"><option value="public">public</option><option value="link">link-only</option><option value="private">private</option></select><button id="publish">Push run</button></div>
    </div></div>`;
  const mineCount = ME ? (runs||[]).filter(r=>r.profile_id===ME.id).length : 0;
  const onboard = (ME && mineCount===0) ? `<div class="panel" style="text-align:center;padding:30px 18px">
    ${runnerHTML()}
    <div style="font-size:20px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px">Your first grind is one command away</div>
    <div class="hint" style="max-width:340px;margin:0 auto 14px">It reads the session you just did, locally, metrics only, and makes your first Run. Nothing leaves your machine until you push.</div>
    <div style="background:#f2f4f2;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:ui-monospace,Menlo,monospace;font-size:14px;display:inline-block">agentgrinder run --push</div>
  </div>` : '';
  app.innerHTML=(onboard||head)+`<div id="trend"></div><h2 class="sec">Latest runs</h2>`+(runs&&runs.length?runs.map(r=>runCard(r,ad.mine.has(r.id),ad.counts[r.id])).join(''):'<div class="empty">'+runnerHTML()+'<div>No runs yet, push your first.<br><span class="num">agentgrinder run --json</span></div></div>');
  trendingRepos().then(t=>{ const el=$('trend'); if(el&&t.length) el.innerHTML=trendingBlock(t); }).catch(()=>{});
  if(ME) wireComposer(); wireKudos(); startRunner();
}

function wireComposer(){
  const ml=$('manuallink'); if(ml) ml.addEventListener('click',e=>{e.preventDefault();$('manualbox').hidden=!$('manualbox').hidden;});
  const pb=$('publish'); if(pb) pb.addEventListener('click',async()=>{ if(!ME)return;
    const {error}=await sb.from('runs').insert({profile_id:ME.id,title:$('f_title').value||'Untitled run',project:$('f_project').value||null,
      harness:null,prompts:+$('f_prompts').value||null,duration_s:(+$('f_dur').value||0)*60||null,commits:+$('f_commits').value||null,
      note:$('f_note')?$('f_note').value||null:null,visibility:$('f_vis').value,started_at:new Date().toISOString()});
    if(error){status(error.message,true);return;} status('Pushed.'); viewMe(); });
}

async function viewProfile(handle){
  const app=$('app');
  const {data:prof}=await sb.from('profiles').select('*').eq('github_handle',handle).single();
  if(!prof){ app.innerHTML='<div class="empty">No such grinder.</div>'; return; }
  const mine=ME&&ME.id===prof.id;
  const {data:runs}=await sb.from('runs').select('*, profiles(github_handle,name)')
    .eq('profile_id',prof.id)[mine?'in':'eq']('visibility',mine?['public','link','private','anonymous']:'public').order('created_at',{ascending:false}).limit(50);
  const R=runs||[]; const {count:acksR}=await sb.from('acks').select('*',{count:'exact',head:true}).eq('to_profile',prof.id);
  const sh=grindShape(R, acksR||0);
  const T={runs:R.length,prompts:R.reduce((a,r)=>a+(r.prompts||0),0),
    hours:Math.round(R.reduce((a,r)=>a+(r.duration_s||0),0)/360)/10, commits:R.reduce((a,r)=>a+(r.commits||0),0),
    ...vptTotals(R)};
  const harnesses=[...new Set(R.map(r=>r.harness).filter(Boolean))];
  const rg=prof.rig||{};
  const rigbits=[]; if(rg.mcps) rigbits.push(rg.mcps+' MCPs'); if(rg.skills) rigbits.push(rg.skills+' skills');
  const mcpChips=(rg.share_names&&rg.mcp_names)?rg.mcp_names.map(n=>`<span class="rig-chip">${esc(n)}</span>`).join(''):'';
  const setup=[harnesses.join(' · '), ...rigbits].filter(Boolean).join(' · ');
  app.innerHTML=`<div class="phero"><div class="av avimg">${avatar(handle)}</div>
      <div><h1>${esc(prof.name||handle)}</h1><div class="h">@${esc(handle)}${setup?' · '+esc(setup):''}</div></div></div>
    <div class="ptotals num"><div title="${esc(VPT_TIP+' · '+T.vptFormula)}" style="cursor:help"><div class="v" style="color:var(--accent-ink)">${T.vpt}</div><div class="k">verified per turn</div></div>
      <div><div class="v" data-count="${T.runs}">0</div><div class="k">runs</div></div>
      <div><div class="v" data-count="${T.prompts}">0</div><div class="k">prompts · cost</div></div>
      <div><div class="v">${T.hours}</div><div class="k">hours</div></div>
      <div><div class="v">${T.commits}</div><div class="k">commits</div></div></div>
    ${shapeRow(sh)}
    ${compareAgents(R)}
    ${mine?`<div class="panel"><h3>Your rig · share with friends</h3>
      <label>harnesses (from your runs)</label>
      <div style="margin-bottom:12px;color:var(--muted)">${harnesses.length?esc(harnesses.join(' · ')):'run agentgrinder to detect'}</div>
      ${mcpChips?`<div class="rig-chips">${mcpChips}</div>`:'<p class="hint">MCP names hidden — check share on next push, or run <span class="num">agentgrinder rig --share-names</span></p>'}
      <label>display name</label><input id="e_name" value="${esc(prof.name||'')}">
      <label>stack notes (what friends should copy)</label><input id="e_skills" value="${esc(rg.notes||'')}" placeholder="e.g. design-taste skill, fleet parallel lanes">
      <label style="display:flex;align-items:center;gap:8px;margin:12px 0;font-size:13px"><input type="checkbox" id="e_share_names" ${rg.share_names?'checked':''}> Show MCP names on shared rig card</label>
      <div class="ob-actions"><button id="savep">Save rig</button>
        <a href="/?share=1&rig=${encodeURIComponent(handle)}"><button type="button" class="ghost">Share rig card</button></a></div></div>`:(
      mcpChips?`<div class="panel"><h3>Rig</h3><div class="rig-chips">${mcpChips}</div>${rg.notes?`<p class="hint" style="margin-top:10px">${esc(rg.notes)}</p>`:''}</div>`:'')}
    <h2 class="sec">${mine?'Your runs':'Runs'}</h2>
    ${mine?`<div style="text-align:center;margin:0 0 18px"><a href="/?share=1&u=${encodeURIComponent(handle)}"><button>Share Scrapbook card</button></a></div>`:''}
    ${R.length?(await (async()=>{const ad=await ackData(R);return R.map(r=>runCard(r,ad.mine.has(r.id),ad.counts[r.id])).join('');})()):'<div class="empty">No runs yet.</div>'}`;
  wireKudos(); countUp();
  if(mine) $('savep').addEventListener('click',async()=>{
    const {error}=await sb.from('profiles').update({name:$('e_name').value||null,rig:{...(prof.rig||{}),notes:$('e_skills').value||'',share_names:!!$('e_share_names')?.checked,mcp_names:(prof.rig||{}).mcp_names||[]}}).eq('id',prof.id);
    status(error?error.message:'Saved.',!!error); if(!error) viewProfile(handle); });
}

async function refreshAuth(){ if(!sb)return;
  const {data:{session}}=await sb.auth.getSession();
  if(session){ const u=session.user,h=u.user_metadata.user_name||u.user_metadata.preferred_username||u.email;
    try{await sb.from('profiles').upsert({auth_uid:u.id,github_handle:h,name:u.user_metadata.full_name||h},{onConflict:'auth_uid'});}catch(e){}
    const {data:p}=await sb.from('profiles').select('*').eq('auth_uid',u.id).single();
    ME=p; $('me').innerHTML=`<a href="/?u=${encodeURIComponent(h)}" style="color:var(--muted);text-decoration:none">@${esc(h)}</a>`; $('auth').textContent='Sign out'; $('deletewrap').hidden=false;
  } else { ME=null; $('me').textContent=''; $('auth').textContent='Sign in with GitHub'; $('deletewrap').hidden=true; }
}

function importRun(){
  const m=location.hash.match(/import=([^&]+)/); if(!m) return false;
  let run; try{ run=JSON.parse(atob(decodeURIComponent(m[1]))); }catch(_){ return false; }
  const app=$('app');
  const rows=[['harness',run.harness],['project',run.project],['prompts (cost)',run.turns_typed],
    ['minutes',run.duration_s?Math.round(run.duration_s/60):null],['tool calls',run.tool_calls],
    ['files',run.files_touched],['commits',run.commits],
    ['verified claims',run.claims_verified!=null&&run.claims!=null?`${run.claims_verified}/${run.claims}`:null],
    ['artifacts produced',run.artifacts_produced],
    ['coach verdict',run.coach_verdict?String(run.coach_verdict).slice(0,160):null],
    ['coach tool calls',run.coach_tool_calls],
    ['vs your last grind',run.progress_verdict]].filter(r=>r[1]!=null&&r[1]!=='');
  // The five-number parts and the coach verdict are saved when the runs table has their columns
  // (supabase/migrations/2026-09-03-coach.sql). On a database without them the insert is retried
  // without those fields and the card says so; nothing is invented and nothing fails silently.
  const unsaved='';
  app.innerHTML=`<div class="panel"><h3>Publish this run?</h3>
    <p class="hint" style="margin:-4px 0 12px">Exactly these numbers will be saved. No prompt text, no code, you can see everything below.</p>
    <div style="border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px">
      ${rows.map((r,i)=>`<div style="display:flex;justify-content:space-between;padding:9px 13px;${i?'border-top:1px solid var(--line);':''}"><span style="color:var(--muted)">${r[0]}</span><b class="num">${esc(String(r[1]))}</b></div>`).join('')}</div>${unsaved}
    <input id="i_title" placeholder="Title (optional, you type this, not scraped)" value="${esc(run.project||'')} session">
    <input id="i_note" placeholder="what did this session do? (optional)">
    <label style="display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:13px;color:var(--muted)">
      <input type="checkbox" id="i_share_rig" ${run.rig_share_names?'checked':''}> Share MCP names on my rig (opt-in)
    </label>
    <input id="i_stack" placeholder="stack notes for friends (optional)" value="${esc(run.rig_notes||'')}">
    <div class="row"><select id="i_vis"><option value="private">private</option><option value="public">public</option><option value="link">link-only</option><option value="anonymous">anonymous · ghost grind</option></select>
    <button id="i_pub">${ME?'Publish':'Sign in to publish'}</button></div></div>`;
  $('i_pub').addEventListener('click',async()=>{
    if(!ME){ sb.auth.signInWithOAuth({provider:'github',options:{redirectTo:location.href}}); return; }
    const base={profile_id:ME.id,title:$('i_title').value||'Untitled run',
      project:run.project||null,harness:run.harness||null,prompts:run.turns_typed||null,duration_s:run.duration_s||null,
      commits:run.commits||null,tool_calls:run.tool_calls||null,files_touched:run.files_touched||null,
      rhythm:run.rhythm||null,note:$('i_note').value||null,visibility:$('i_vis').value,started_at:run.started||new Date().toISOString()};
    // the coach columns (nullable; migration 2026-09-03-coach.sql). Retry without them on a
    // database that does not have them yet, and say so.
    const coach={claims:run.claims??null,claims_verified:run.claims_verified??null,artifacts_produced:run.artifacts_produced??null,
      coach_verdict:run.coach_verdict??null,coach_plan:run.coach_plan??null,coach_tool_calls:run.coach_tool_calls??null,
      progress_verdict:run.progress_verdict??null};
    let {error}=await sb.from('runs').insert({...base,...coach});
    let partial=false;
    if(error&&/column|schema cache/i.test(error.message||'')){ ({error}=await sb.from('runs').insert(base)); partial=!error; }
    if(!error){
      const rig={...(ME.rig||{})};
      if(run.rig_mcps!=null) rig.mcps=run.rig_mcps;
      if(run.rig_skills!=null) rig.skills=run.rig_skills;
      const notes=$('i_stack')?.value; if(notes) rig.notes=notes;
      if($('i_share_rig')?.checked && run.rig_mcp_names){ rig.mcp_names=run.rig_mcp_names; rig.share_names=true; }
      await sb.from('profiles').update({rig}).eq('id',ME.id);
    }
    if(error){status(error.message,true);return;}
    history.replaceState(null,'','/'); status(partial?'Published. The database has no coach columns yet, so verified claims and the verdict were shown but not stored.':'Published to your grind.');
    localStorage.setItem('ag_onboard_done','1'); viewMe();
  });
  return true;
}

async function viewShareRun(id){
  const app=$('app');
  const q=new URLSearchParams(location.search);
  const {data:r}=await sb.from('runs').select('*, profiles(github_handle,name)').eq('id',id).single();
  if(!r){ app.innerHTML='<div class="empty">Run not found or private.</div>'; return; }
  const att=runAttribution(r);
  const bits=[r.harness,r.project].filter(Boolean);
  app.innerHTML=shareCardHtml({
    handle:att.handle, ghost:att.ghost, stamp:att.ghost?'GHOST GRIND':'CLAIMED',
    lead:att.ghost?'Someone posted a grind':'@'+(r.profiles||{}).github_handle+' posted a grind',
    sub:bits.join(' · ')||r.title||'Real session',
    heroN:vptText(r), heroK:'verified per turn', heroTip:VPT_TIP+' · '+vptFormula(r), rhythm:r.rhythm, headline:r.note||null,
    stats:shareStatsGrind(r), roast:q.get('roast')?roastShapeLines(r):null,
  });
  fitShareCard(); window.addEventListener('resize',fitShareCard);
  const copy=$('share-copy'); if(copy) copy.addEventListener('click',()=>{
    navigator.clipboard.writeText(location.origin+'/?run='+id).then(()=>status('Link copied.'));
  });
}

async function viewEvent(){
  const app=$('app');
  const {data:runs}=await sb.from('runs').select('*, profiles(github_handle,name)').in('visibility',['public','anonymous']).order('created_at',{ascending:false}).limit(40);
  const ad=await ackData(runs||[]);
  app.innerHTML=`<div class="phero" style="margin-bottom:18px"><div>
    <h1 style="margin:0;font-size:26px;font-weight:800">Agents for Humans</h1>
    <div class="h">Sep 14 2026 · grind event · post your real runs</div></div></div>
    <div class="panel"><p class="hint" style="margin:0;line-height:1.6">Tag your grind for the hackathon crew. Publish from <span class="num">agentgrinder grind --push</span> — metrics only, your click. No streaks. Agents propose, you ship.</p></div>
    <h2 class="sec">Event feed</h2>
    ${runs&&runs.length?runs.map(r=>runCard(r,ad.mine.has(r.id),ad.counts[r.id])).join(''):'<div class="empty">'+runnerHTML()+'<div style="font-weight:800;margin-top:8px">Be the first on the board</div><div class="hint">agentgrinder grind --push</div></div>'}`;
  wireKudos(); startRunner();

async function route(){ authErrorFromUrl();
  if(importRun()) return;
  const q=new URLSearchParams(location.search);
  if(q.get('claim')) return viewClaim();
  if(q.get('pitch')!==null) return viewPitch();
  if(q.get('event')) return viewEvent();
  if(q.get('share')!==null){
    if(q.get('rig')) return viewShareRig(q.get('rig'));
    const u=q.get('u'); if(u) return viewShareProfile(u);
    const rn=q.get('run'); if(rn) return viewShareRun(rn);
  }
  if(await shouldOnboard()) return viewOnboard();
  const u=q.get('u'); const rn=q.get('run');
  if(rn) return viewRun(rn); if(u) return viewProfile(u); if(q.get('explore')!==null) return viewExplore(); return ME?viewMe():viewLanding(); }

document.addEventListener('DOMContentLoaded',()=>{
  const boot=document.getElementById('boot'); if(boot){boot.innerHTML=runnerHTML();startRunner();}
  $('auth').addEventListener('click',async()=>{ if(!sb){status('Refresh.',true);return;}
    const {data:{session}}=await sb.auth.getSession();
    if(session){await sb.auth.signOut();location.href='/';return;}
    status('Redirecting to GitHub…');
    const dest=location.origin+(ME?'/': '/?onboard');
    const {error}=await sb.auth.signInWithOAuth({provider:'github',options:{redirectTo:dest}});
    if(error)status(error.message,true); });
  $('delete').addEventListener('click',async e=>{e.preventDefault(); if(!ME)return; if(!confirm('Delete your profile and all your runs? Cannot be undone.'))return;
    await sb.from('profiles').delete().eq('id',ME.id); await sb.auth.signOut(); location.href='/'; });
  if(sb){ refreshAuth().then(route); sb.auth.onAuthStateChange(()=>refreshAuth().then(route)); } else route();
});
